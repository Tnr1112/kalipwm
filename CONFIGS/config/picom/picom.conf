##############################################################################
#                                  CORNERS                                   #
##############################################################################

corner-radius = 12;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "class_g = 'Polybar'",
];

##############################################################################
#                                  SHADOWS                                   #
##############################################################################

shadow = true;
shadow-radius = 15;
shadow-opacity = 0.5;
shadow-offset-x = -15;
shadow-offset-y = -15;

shadow-exclude = [
  "class_g = 'firefox' && argb",
  "class_g = 'Polybar'",
  "_GTK_FRAME_EXTENTS@:c",
];

##############################################################################
#                                  FADING                                    #
##############################################################################

fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;
fade-delta = 5;

fade-exclude = [];

##############################################################################
#                                   OPACITY                                  #
##############################################################################

inactive-opacity = 1.0;
frame-opacity = 1.0;
inactive-opacity-override = false;
active-opacity = 1.0;

focus-exclude = [
  "class_g = 'Cairo-clock'",
  "class_g = 'Bar'",
  "class_g = 'slop'"
];

opacity-rule = [
  "90:class_g = 'Alacritty' && focused",
  "80:class_g = 'Alacritty' && !focused",
  "90:class_g = 'kitty' && focused",
  "80:class_g = 'kitty' && !focused",
];

##############################################################################
#                                    BLUR                                    #
##############################################################################

blur-method = "dual_kawase";
blur-size = 2;
blur-strength = 3;
blur-background = true;
blur-background-frame = false;
blur-background-fixed = false;

blur-background-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "_GTK_FRAME_EXTENTS@:c"
];

##############################################################################
#                                 ANIMATIONS                                 #
##############################################################################

# Requiere picom v12+ (oficial de yshui)
# Documentación: https://picom.app/#_animations
animations = true;

# Animaciones globales (fallback si no hay regla específica)
animation-for-open-window = "zoom";
animation-for-unmap-window = "squeeze";
animation-for-transient-window = "slide-down";

# Excluir ventanas de animaciones
animation-exclude = [
  "class_g = 'flameshot'",
  "class_g = 'Dunst'",
  "class_g = 'Polybar'",
  "window_type = 'dock'",
];

##############################################################################
#                            ANIMACIONES AVANZADAS                           #
##############################################################################

# Sistema de reglas unificado para animaciones (picom v12+)
# 
# Presets disponibles:
# - "fly-in", "fly-out" (con direction: up, down, left, right)
# - "slide-in", "slide-out" (con direction)
# - "zoom" (escala desde/hacia el centro)
# - "squeeze", "squeeze-bottom", "squeeze-top"
# - "appear", "disappear" (fade simple)
#
# Triggers disponibles:
# - "open": cuando se abre la ventana
# - "close": cuando se cierra
# - "show": cuando se muestra (ej: al cambiar de workspace)
# - "hide": cuando se oculta
# - "geometry": cuando cambia tamaño/posición (o usar "size"/"position" por separado)

rules = (
  # ═══════════════════════════════════════════════════════════════════════════
  # VENTANAS NORMALES
  # ═══════════════════════════════════════════════════════════════════════════
  {
    match = "window_type = 'normal'";
    animations = (
      {
        triggers = ["open"];
        preset = "zoom";
        duration = 0.3;
      },
      {
        triggers = ["close"];
        preset = "zoom";
        duration = 0.25;
      },
      {
        triggers = ["geometry"];
        preset = "slide-out";
        direction = "right";
        duration = 0.2;
      }
    );
  },
  
  # ═══════════════════════════════════════════════════════════════════════════
  # TERMINALES (Kitty, Alacritty)
  # ═══════════════════════════════════════════════════════════════════════════
  {
    match = "class_g = 'kitty' || class_g = 'Alacritty'";
    animations = (
      {
        triggers = ["open"];
        preset = "fly-in";
        direction = "up";
        duration = 0.25;
      },
      {
        triggers = ["close"];
        preset = "fly-out";
        direction = "down";
        duration = 0.2;
      }
    );
  },
  
  # ═══════════════════════════════════════════════════════════════════════════
  # ROFI / LAUNCHERS
  # ═══════════════════════════════════════════════════════════════════════════
  {
    match = "class_g = 'Rofi'";
    animations = (
      {
        triggers = ["open"];
        preset = "zoom";
        duration = 0.15;
      },
      {
        triggers = ["close"];
        preset = "zoom";
        duration = 0.1;
      }
    );
    corner-radius = 20;
    shadow = true;
  },
  
  # ═══════════════════════════════════════════════════════════════════════════
  # DIÁLOGOS Y POPUPS
  # ═══════════════════════════════════════════════════════════════════════════
  {
    match = "window_type = 'dialog'";
    animations = (
      {
        triggers = ["open"];
        preset = "slide-down";
        duration = 0.2;
      },
      {
        triggers = ["close"];
        preset = "slide-up";
        duration = 0.15;
      }
    );
  },
  
  # ═══════════════════════════════════════════════════════════════════════════
  # MENÚS POPUP/DROPDOWN
  # ═══════════════════════════════════════════════════════════════════════════
  {
    match = "window_type = 'popup_menu' || window_type = 'dropdown_menu'";
    animations = (
      {
        triggers = ["open"];
        preset = "slide-down";
        duration = 0.1;
      },
      {
        triggers = ["close"];
        preset = "slide-up";
        duration = 0.08;
      }
    );
    shadow = true;
    opacity = 0.95;
  },
  
  # ═══════════════════════════════════════════════════════════════════════════
  # TOOLTIPS
  # ═══════════════════════════════════════════════════════════════════════════
  {
    match = "window_type = 'tooltip'";
    animations = (
      {
        triggers = ["open"];
        preset = "appear";
        duration = 0.1;
      },
      {
        triggers = ["close"];
        preset = "disappear";
        duration = 0.08;
      }
    );
    opacity = 0.9;
    shadow = true;
  },
  
  # ═══════════════════════════════════════════════════════════════════════════
  # NOTIFICACIONES (Dunst)
  # ═══════════════════════════════════════════════════════════════════════════
  {
    match = "class_g = 'Dunst' || window_type = 'notification'";
    animations = (
      {
        triggers = ["open"];
        preset = "slide-in";
        direction = "right";
        duration = 0.2;
      },
      {
        triggers = ["close"];
        preset = "slide-out";
        direction = "right";
        duration = 0.15;
      }
    );
  },
  
  # ═══════════════════════════════════════════════════════════════════════════
  # FIREFOX / NAVEGADORES
  # ═══════════════════════════════════════════════════════════════════════════
  {
    match = "class_g = 'firefox' || class_g = 'Chromium' || class_g = 'Google-chrome'";
    animations = (
      {
        triggers = ["open"];
        preset = "zoom";
        duration = 0.35;
      },
      {
        triggers = ["close"];
        preset = "squeeze";
        duration = 0.25;
      }
    );
  },
  
  # ═══════════════════════════════════════════════════════════════════════════
  # EWW WIDGETS
  # ═══════════════════════════════════════════════════════════════════════════
  {
    match = "class_g = 'eww' || class_g = 'Eww'";
    animations = (
      {
        triggers = ["open"];
        preset = "slide-in";
        direction = "left";
        duration = 0.2;
      },
      {
        triggers = ["close"];
        preset = "slide-out";
        direction = "left";
        duration = 0.15;
      }
    );
    shadow = false;
  },
  
  # ═══════════════════════════════════════════════════════════════════════════
  # PANTALLA COMPLETA - Sin efectos visuales
  # ═══════════════════════════════════════════════════════════════════════════
  {
    match = "fullscreen";
    corner-radius = 0;
    shadow = false;
    animations = ();
  },
  
  # ═══════════════════════════════════════════════════════════════════════════
  # BARRA DE TAREAS (Polybar, etc.)
  # ═══════════════════════════════════════════════════════════════════════════
  {
    match = "window_type = 'dock' || class_g = 'Polybar'";
    shadow = false;
    corner-radius = 0;
    animations = ();
  }
);

##############################################################################
#                                    GENERAL                                 #
##############################################################################

backend = "glx";
vsync = true;
dbus = true;

mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
detect-client-leader = true;

use-damage = true;
log-level = "warn";

# Tipos de ventana específicos (fallback para compatibilidad)
wintypes:
{
  tooltip = { fade = true; shadow = true; opacity = 0.9; focus = true; };
  dock = { shadow = false; clip-shadow-above = true; };
  dnd = { shadow = false; };
  popup_menu = { opacity = 0.95; shadow = true; };
  dropdown_menu = { opacity = 0.95; shadow = true; };
  utility = { shadow = false; };
  notification = { shadow = true; };
};
