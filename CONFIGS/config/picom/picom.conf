##############################################################################
#                                  CORNERS                                   #
##############################################################################
corner-radius = 12;
detect-rounded-corners = true;

##############################################################################
#                                  SHADOWS                                   #
##############################################################################
shadow = true;
shadow-radius = 15;
shadow-opacity = 0.5;
shadow-offset-x = -15;
shadow-offset-y = -15;

##############################################################################
#                                  FADING                                    #
##############################################################################
fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;
fade-delta = 5;

##############################################################################
#                                   BLUR                                     #
##############################################################################
blur-method = "dual_kawase";
blur-size = 2;
blur-strength = 3;
blur-background = true;
blur-background-frame = false;
blur-background-fixed = false;

##############################################################################
#                                   RULES                                    #
##############################################################################
rules = (

  # ── Terminales (Opacidad) ───────────────────────────────────────────────
  {
    match = "(class_g = 'kitty' || class_g = 'Alacritty') && focused";
    opacity = 0.9;
  },
  {
    match = "(class_g = 'kitty' || class_g = 'Alacritty') && !focused";
    opacity = 0.8;
  },

  # ── Exclusiones generales ───────────────────────────────────────────────
  {
    match = "class_g = 'firefox' && argb || _GTK_FRAME_EXTENTS@:c || class_g = 'Cairo-clock' || class_g = 'slop'";
    shadow = false;
    blur-background = false;
  },
  {
    match = "window_type = 'desktop' || window_type = 'dnd' || window_type = 'utility'";
    shadow = false;
    blur-background = false;
    corner-radius = 0;
  },

  # ── VENTANAS NORMALES (Valores idénticos a Configuración 1) ─────────────
  {
    match = "window_type = 'normal'";
    animations = (
      {
        triggers = ["close"];
        opacity = {
          curve = "cubic-bezier(0,1,1,1)";
          duration = 0.3;
          start = "window-raw-opacity-before";
          end = 0;
        };
        blur-opacity = "opacity";
        shadow-opacity = "opacity";

        scale-x = {
          curve = "cubic-bezier(0,1.3,1,1)";
          duration = 0.3;
          start = 1;
          end = 0.6;
        };
        scale-y = "scale-x";

        offset-x = "(1 - scale-x) / 2 * window-width";
        offset-y = "(1 - scale-y) / 2 * window-height";

        shadow-scale-x = "scale-x";
        shadow-scale-y = "scale-y";
        shadow-offset-x = "offset-x";
        shadow-offset-y = "offset-y";
      },
      {
        triggers = ["open"];
        opacity = {
          curve = "cubic-bezier(0,1,1,1)";
          duration = 0.5;
          start = 0;
          end = "window-raw-opacity";
        };
        blur-opacity = "opacity";
        shadow-opacity = "opacity";

        scale-x = {
          curve = "cubic-bezier(0,1.3,1,1)";
          duration = 0.5;
          start = 0.6;
          end = 1;
        };
        scale-y = "scale-x";

        offset-x = "(1 - scale-x) / 2 * window-width";
        offset-y = "(1 - scale-y) / 2 * window-height";

        shadow-scale-x = "scale-x";
        shadow-scale-y = "scale-y";
        shadow-offset-x = "offset-x";
        shadow-offset-y = "offset-y";
      },
      {
        triggers = ["geometry"];
        scale-x = {
          curve = "cubic-bezier(0,0,0,1.28)";
          duration = 0.5;
          start = "window-width-before / window-width";
          end = 1;
        };

        scale-x-reverse = {
          curve = "cubic-bezier(0,0,0,1.28)";
          duration = 0.3;
          start = "window-width / window-width-before";
          end = 1;
        };
        scale-y = {
          curve = "cubic-bezier(0,0,0,1.28)";
          duration = 0.5;
          start = "window-height-before / window-height";
          end = 1;
        };
        scale-y-reverse = {
          curve = "cubic-bezier(0,0,0,1.28)";
          duration = 0.5;
          start = "window-height / window-height-before";
          end = 1;
        };
        offset-x = {
          curve = "cubic-bezier(0,0,0,1.28)";
          duration = 0.5;
          start = "window-x-before - window-x";
          end = 0;
        };
        offset-y = {
          curve = "cubic-bezier(0,0,0,1.28)";
          duration = 0.5;
          start = "window-y-before - window-y";
          end = 0;
        };
        shadow-scale-x = "scale-x";
        shadow-scale-y = "scale-y";
        shadow-offset-x = "offset-x";
        shadow-offset-y = "offset-y";
      }
    );
  },

  # ── BSPWM WORKSPACE CHANGES (Bloque idéntico a Configuración 1) ──────────
  {
    triggers = ["show"];
    opacity = {
      curve = "cubic-bezier(0,1,1,1)";
      duration = 0.5;
      start = 0;
      end = "window-raw-opacity";
    };
    blur-opacity = "opacity";
    shadow-opacity = "opacity";

    scale-x = {
      curve = "cubic-bezier(0,1.3,1,1)";
      duration = 0.5;
      start = 0.6;
      end = 1;
    };
    scale-y = "scale-x";

    offset-x = "(1 - scale-x) / 2 * window-width";
    offset-y = "(1 - scale-y) / 2 * window-height";

    shadow-scale-x = "scale-x";
    shadow-scale-y = "scale-y";
    shadow-offset-x = "offset-x";
    shadow-offset-y = "offset-y";
  },

  # ── APPS ESPECÍFICAS (Presets agregados del RAR) ────────────────────────
  {
    match = "class_g = 'Dunst' || window_type = 'notification'";
    shadow = true;
    animations = (
      { triggers = ["close", "hide"]; preset = "fly-out"; direction = "up"; duration = 0.2; },
      { triggers = ["open", "show"]; preset = "fly-in"; direction = "up"; duration = 0.2; }
    );
  },

  {
    match = "class_g = 'bspwm-scratch' || class_i = 'bspwm-scratch'";
    shadow = false;
    animations = (
      { triggers = ["close", "hide"]; preset = "fly-out"; direction = "up"; duration = 0.3; },
      { triggers = ["open", "show"]; preset = "fly-in"; direction = "up"; duration = 0.3; }
    );
  },

 {
    match = "class_g = 'Rofi' || class_g = 'rofi'";
    corner-radius = 20;
    shadow = true;
    animations = (
      {
        triggers = ["open", "show"];
        opacity = {
          curve = "cubic-bezier(0,1,1,1)";
          duration = 0.35;
          start = 0;
          end = 1;
        };
        blur-opacity = "opacity";
        shadow-opacity = "opacity";

        scale-x = {
          curve = "cubic-bezier(0,1.3,1,1)";
          duration = 0.35;
          start = 0.6;
          end = 1;
        };
        scale-y = "scale-x";

        offset-x = "(1 - scale-x) / 2 * window-width";
        offset-y = "(1 - scale-y) / 2 * window-height";

        shadow-scale-x = "scale-x";
        shadow-scale-y = "scale-y";
        shadow-offset-x = "offset-x";
        shadow-offset-y = "offset-y";
      },
      {
        triggers = ["close", "hide"];
        opacity = {
          curve = "cubic-bezier(0,1,1,1)";
          duration = 0.25;
          start = 1;
          end = 0;
        };
        blur-opacity = "opacity";
        shadow-opacity = "opacity";

        scale-x = {
          curve = "cubic-bezier(0,1.3,1,1)";
          duration = 0.25;
          start = 1;
          end = 0.6;
        };
        scale-y = "scale-x";

        offset-x = "(1 - scale-x) / 2 * window-width";
        offset-y = "(1 - scale-y) / 2 * window-height";

        shadow-scale-x = "scale-x";
        shadow-scale-y = "scale-y";
        shadow-offset-x = "offset-x";
        shadow-offset-y = "offset-y";
      }
    );
  },

  {
    match = "class_g = 'jgmenu'";
    shadow = false;
    animations = (
      { triggers = ["close", "hide"]; preset = "disappear"; duration = 0.08; scale = 0.5; },
      { triggers = ["open", "show"]; preset = "appear"; duration = 0.08; scale = 0.5; }
    );
  },

  {
    match = "name = 'Eww - launchermenu'";
    animations = (
      { triggers = ["close", "hide"]; preset = "slide-out"; direction = "right"; duration = 0.2; },
      { triggers = ["open", "show"]; preset = "slide-in"; direction = "right"; duration = 0.2; }
    );
  },

  {
    match = "name = 'Eww - music'";
    animations = (
      { triggers = ["close", "hide"]; preset = "slide-out"; direction = "down"; duration = 0.3; },
      { triggers = ["open", "show"]; preset = "slide-in"; direction = "up"; duration = 0.3; }
    );
  },

  # Docks & Fullscreen
  {
    match = "fullscreen";
    corner-radius = 0;
    shadow = false;
    animations = ();
  },
  {
    match = "window_type = 'dock' || class_g = 'Polybar' || name = 'Eww - bar'";
    shadow = false;
    blur-background = false;
    corner-radius = 0;
    animations = ();
  }
);

##############################################################################
#                                   GENERAL                                  #
##############################################################################
backend = "glx";
vsync = true;
dbus = true;
detect-client-opacity = true;
detect-transient = true;
detect-client-leader = true;
use-damage = true;
log-level = "warn";
