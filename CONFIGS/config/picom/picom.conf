##############################################################################
#                                  CORNERS                                   #
##############################################################################

corner-radius = 12;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "class_g = 'Polybar'",
];

##############################################################################
#                                  SHADOWS                                   #
##############################################################################

shadow = true;
shadow-radius = 15;
shadow-opacity = 0.5;
shadow-offset-x = -15;
shadow-offset-y = -15;

shadow-exclude = [
  "class_g = 'firefox' && argb",
  "class_g = 'Polybar'",
  "_GTK_FRAME_EXTENTS@:c",
];

##############################################################################
#                                  FADING                                    #
##############################################################################

fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;
fade-delta = 5;

fade-exclude = [];

##############################################################################
#                                   OPACITY                                  #
##############################################################################

inactive-opacity = 1.0;
frame-opacity = 1.0;
inactive-opacity-override = false;
active-opacity = 1.0;

focus-exclude = [
  "class_g = 'Cairo-clock'",
  "class_g = 'Bar'",
  "class_g = 'slop'"
];

opacity-rule = [
  "90:class_g = 'Alacritty' && focused",
  "80:class_g = 'Alacritty' && !focused",
  "90:class_g = 'kitty' && focused",
  "80:class_g = 'kitty' && !focused",
];

##############################################################################
#                                    BLUR                                    #
##############################################################################

blur-method = "dual_kawase";
blur-size = 2;
blur-strength = 3;
blur-background = true;
blur-background-frame = false;
blur-background-fixed = false;

blur-background-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "_GTK_FRAME_EXTENTS@:c"
];

##############################################################################
#                          ANIMATIONS (picom v13+)                           #
##############################################################################
# 
# Documentación: https://github.com/yshui/picom/blob/next/picom.sample.conf
# 
# En picom v13 NO existen presets como "zoom", "slide-in", etc.
# Las animaciones se definen con propiedades de transformación:
#   - opacity: transparencia (0-1)
#   - scale-x, scale-y: escala
#   - offset-x, offset-y: desplazamiento en píxeles
#
# Cada propiedad tiene:
#   - timing: duración en segundos
#   - start: valor inicial
#   - end: valor final (opcional)

animations = true;

# ═══════════════════════════════════════════════════════════════════════════
#                              REGLAS DE ANIMACIÓN
# ═══════════════════════════════════════════════════════════════════════════

rules = (
  # ─────────────────────────────────────────────────────────────────────────
  # VENTANAS NORMALES - Efecto Zoom al abrir/cerrar
  # ─────────────────────────────────────────────────────────────────────────
  {
    match = "window_type = 'normal'";
    animations = (
      {
        triggers = ["open"];
        opacity = {
          timing = 0.2;
          start = 0;
          end = 1;
        };
        scale-x = {
          timing = 0.2;
          start = 0.8;
          end = 1;
        };
        scale-y = {
          timing = 0.2;
          start = 0.8;
          end = 1;
        };
        offset-y = {
          timing = 0.2;
          start = -20;
          end = 0;
        };
      },
      {
        triggers = ["close"];
        opacity = {
          timing = 0.15;
          start = 1;
          end = 0;
        };
        scale-x = {
          timing = 0.15;
          start = 1;
          end = 0.8;
        };
        scale-y = {
          timing = 0.15;
          start = 1;
          end = 0.8;
        };
      },
      {
        triggers = ["geometry"];
        scale-x = {
          timing = 0.15;
          start = "window-width-before / window-width";
          end = 1;
        };
        scale-y = {
          timing = 0.15;
          start = "window-height-before / window-height";
          end = 1;
        };
      }
    );
  },

  # ─────────────────────────────────────────────────────────────────────────
  # TERMINALES (Kitty, Alacritty) - Slide desde arriba
  # ─────────────────────────────────────────────────────────────────────────
  {
    match = "class_g = 'kitty' || class_g = 'Alacritty'";
    animations = (
      {
        triggers = ["open"];
        opacity = {
          timing = 0.2;
          start = 0;
          end = 1;
        };
        offset-y = {
          timing = 0.2;
          start = -50;
          end = 0;
        };
        scale-x = {
          timing = 0.2;
          start = 0.95;
          end = 1;
        };
        scale-y = {
          timing = 0.2;
          start = 0.95;
          end = 1;
        };
      },
      {
        triggers = ["close"];
        opacity = {
          timing = 0.15;
          start = 1;
          end = 0;
        };
        offset-y = {
          timing = 0.15;
          start = 0;
          end = 50;
        };
      }
    );
  },

  # ─────────────────────────────────────────────────────────────────────────
  # ROFI / LAUNCHERS - Zoom rápido
  # ─────────────────────────────────────────────────────────────────────────
  {
    match = "class_g = 'Rofi'";
    animations = (
      {
        triggers = ["open"];
        opacity = {
          timing = 0.12;
          start = 0;
          end = 1;
        };
        scale-x = {
          timing = 0.12;
          start = 0.9;
          end = 1;
        };
        scale-y = {
          timing = 0.12;
          start = 0.9;
          end = 1;
        };
      },
      {
        triggers = ["close"];
        opacity = {
          timing = 0.1;
          start = 1;
          end = 0;
        };
        scale-x = {
          timing = 0.1;
          start = 1;
          end = 0.9;
        };
        scale-y = {
          timing = 0.1;
          start = 1;
          end = 0.9;
        };
      }
    );
    corner-radius = 20;
    shadow = true;
  },

  # ─────────────────────────────────────────────────────────────────────────
  # DIÁLOGOS - Slide desde arriba
  # ─────────────────────────────────────────────────────────────────────────
  {
    match = "window_type = 'dialog'";
    animations = (
      {
        triggers = ["open"];
        opacity = {
          timing = 0.18;
          start = 0;
          end = 1;
        };
        offset-y = {
          timing = 0.18;
          start = -30;
          end = 0;
        };
      },
      {
        triggers = ["close"];
        opacity = {
          timing = 0.12;
          start = 1;
          end = 0;
        };
        offset-y = {
          timing = 0.12;
          start = 0;
          end = -20;
        };
      }
    );
  },

  # ─────────────────────────────────────────────────────────────────────────
  # MENÚS POPUP/DROPDOWN
  # ─────────────────────────────────────────────────────────────────────────
  {
    match = "window_type = 'popup_menu' || window_type = 'dropdown_menu'";
    animations = (
      {
        triggers = ["open"];
        opacity = {
          timing = 0.1;
          start = 0;
          end = 1;
        };
        offset-y = {
          timing = 0.1;
          start = -10;
          end = 0;
        };
      },
      {
        triggers = ["close"];
        opacity = {
          timing = 0.08;
          start = 1;
          end = 0;
        };
      }
    );
    shadow = true;
    opacity = 0.95;
  },

  # ─────────────────────────────────────────────────────────────────────────
  # TOOLTIPS - Fade simple
  # ─────────────────────────────────────────────────────────────────────────
  {
    match = "window_type = 'tooltip'";
    animations = (
      {
        triggers = ["open"];
        opacity = {
          timing = 0.1;
          start = 0;
          end = 1;
        };
      },
      {
        triggers = ["close"];
        opacity = {
          timing = 0.08;
          start = 1;
          end = 0;
        };
      }
    );
    opacity = 0.9;
    shadow = true;
  },

  # ─────────────────────────────────────────────────────────────────────────
  # NOTIFICACIONES (Dunst) - Slide desde la derecha
  # ─────────────────────────────────────────────────────────────────────────
  {
    match = "class_g = 'Dunst' || window_type = 'notification'";
    animations = (
      {
        triggers = ["open"];
        opacity = {
          timing = 0.2;
          start = 0;
          end = 1;
        };
        offset-x = {
          timing = 0.2;
          start = 50;
          end = 0;
        };
      },
      {
        triggers = ["close"];
        opacity = {
          timing = 0.15;
          start = 1;
          end = 0;
        };
        offset-x = {
          timing = 0.15;
          start = 0;
          end = 50;
        };
      }
    );
  },

  # ─────────────────────────────────────────────────────────────────────────
  # FIREFOX / NAVEGADORES - Zoom suave
  # ─────────────────────────────────────────────────────────────────────────
  {
    match = "class_g = 'firefox' || class_g = 'Chromium' || class_g = 'Google-chrome'";
    animations = (
      {
        triggers = ["open"];
        opacity = {
          timing = 0.25;
          start = 0;
          end = 1;
        };
        scale-x = {
          timing = 0.25;
          start = 0.9;
          end = 1;
        };
        scale-y = {
          timing = 0.25;
          start = 0.9;
          end = 1;
        };
      },
      {
        triggers = ["close"];
        opacity = {
          timing = 0.2;
          start = 1;
          end = 0;
        };
        scale-x = {
          timing = 0.2;
          start = 1;
          end = 0.9;
        };
        scale-y = {
          timing = 0.2;
          start = 1;
          end = 0.9;
        };
      }
    );
  },

  # ─────────────────────────────────────────────────────────────────────────
  # EWW WIDGETS - Slide desde la izquierda
  # ─────────────────────────────────────────────────────────────────────────
  {
    match = "class_g = 'eww' || class_g = 'Eww'";
    animations = (
      {
        triggers = ["open"];
        opacity = {
          timing = 0.2;
          start = 0;
          end = 1;
        };
        offset-x = {
          timing = 0.2;
          start = -30;
          end = 0;
        };
      },
      {
        triggers = ["close"];
        opacity = {
          timing = 0.15;
          start = 1;
          end = 0;
        };
        offset-x = {
          timing = 0.15;
          start = 0;
          end = -30;
        };
      }
    );
    shadow = false;
  },

  # ─────────────────────────────────────────────────────────────────────────
  # FULLSCREEN - Sin animaciones ni decoraciones
  # ─────────────────────────────────────────────────────────────────────────
  {
    match = "fullscreen";
    corner-radius = 0;
    shadow = false;
    animations = ();
  },

  # ─────────────────────────────────────────────────────────────────────────
  # POLYBAR / DOCKS - Sin animaciones
  # ─────────────────────────────────────────────────────────────────────────
  {
    match = "window_type = 'dock' || class_g = 'Polybar'";
    shadow = false;
    corner-radius = 0;
    animations = ();
  },

  # ─────────────────────────────────────────────────────────────────────────
  # CATCH-ALL: Animación por defecto para todo lo demás
  # ─────────────────────────────────────────────────────────────────────────
  {
    animations = (
      {
        triggers = ["open"];
        opacity = {
          timing = 0.2;
          start = 0;
          end = 1;
        };
        scale-x = {
          timing = 0.2;
          start = 0.9;
          end = 1;
        };
        scale-y = {
          timing = 0.2;
          start = 0.9;
          end = 1;
        };
      },
      {
        triggers = ["close"];
        opacity = {
          timing = 0.15;
          start = 1;
          end = 0;
        };
        scale-x = {
          timing = 0.15;
          start = 1;
          end = 0.9;
        };
        scale-y = {
          timing = 0.15;
          start = 1;
          end = 0.9;
        };
      },
      {
        triggers = ["show"];
        opacity = {
          timing = 0.15;
          start = 0;
          end = 1;
        };
        offset-x = {
          timing = 0.15;
          start = -20;
          end = 0;
        };
      },
      {
        triggers = ["hide"];
        opacity = {
          timing = 0.15;
          start = 1;
          end = 0;
        };
        offset-x = {
          timing = 0.15;
          start = 0;
          end = 20;
        };
      }
    );
  }
);

##############################################################################
#                                    GENERAL                                 #
##############################################################################

backend = "glx";
vsync = true;
dbus = true;

mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
detect-client-leader = true;

use-damage = true;
log-level = "warn";

# Tipos de ventana específicos (fallback para compatibilidad)
wintypes:
{
  tooltip = { fade = true; shadow = true; opacity = 0.9; focus = true; };
  dock = { shadow = false; clip-shadow-above = true; };
  dnd = { shadow = false; };
  popup_menu = { opacity = 0.95; shadow = true; };
  dropdown_menu = { opacity = 0.95; shadow = true; };
  utility = { shadow = false; };
  notification = { shadow = true; };
};
