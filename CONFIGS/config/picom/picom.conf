##############################################################################
#                                  CORNERS                                   #
##############################################################################
corner-radius = 12;
detect-rounded-corners = true;

##############################################################################
#                                  SHADOWS                                   #
##############################################################################
shadow = true;
shadow-radius = 15;
shadow-opacity = 0.5;
shadow-offset-x = -15;
shadow-offset-y = -15;

##############################################################################
#                                  FADING                                    #
##############################################################################
fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;
fade-delta = 5;

##############################################################################
#                                   BLUR                                     #
##############################################################################
blur-method = "dual_kawase";
blur-size = 2;
blur-strength = 3;
blur-background = true;
blur-background-frame = false;
blur-background-fixed = false;

##############################################################################
#                          ANIMATIONS (picom v13+)                           #
##############################################################################

##############################################################################
#                              REGLAS (RULES)                                #
##############################################################################
rules = (
  # ─────────────────────────────────────────────────────────────────────────
  # MIGRACIÓN DE EXCLUSIONES ANTIGUAS (Terminales, GTK, Escritorio)
  # ─────────────────────────────────────────────────────────────────────────
  {
    match = "(class_g = 'kitty' || class_g = 'Alacritty') && focused";
    opacity = 0.9;
  },
  {
    match = "(class_g = 'kitty' || class_g = 'Alacritty') && !focused";
    opacity = 0.8;
  },
  {
    match = "class_g = 'firefox' && argb || _GTK_FRAME_EXTENTS@:c || class_g = 'Cairo-clock' || class_g = 'slop'";
    shadow = false;
    blur-background = false;
  },
  {
    match = "window_type = 'desktop' || window_type = 'dnd' || window_type = 'utility'";
    shadow = false;
    blur-background = false;
    corner-radius = 0;
  },

  # ─────────────────────────────────────────────────────────────────────────
  # VENTANAS NORMALES - Efecto Zoom al abrir/cerrar
  # ─────────────────────────────────────────────────────────────────────────
  {
    match = "window_type = 'normal'";
    animations = (
      {
        triggers = ["close"];
        opacity = {
          curve = "cubic-bezier(0,1,1,1)";
          duration = 0.3;
          start = "window-raw-opacity-before";
          end = 0;
        };
        blur-opacity = "opacity";
        shadow-opacity = "opacity";

        scale-x = {
          curve = "cubic-bezier(0,1.3,1,1)";
          duration = 0.3;
          start = 1;
          end = 0.6;
        };
        scale-y = "scale-x";

        offset-x = "(1 - scale-x) / 2 * window-width";
        offset-y = "(1 - scale-y) / 2 * window-height";

        shadow-scale-x = "scale-x";
        shadow-scale-y = "scale-y";
        shadow-offset-x = "offset-x";
        shadow-offset-y = "offset-y";
      },
      {
        triggers = ["open"];
        opacity = {
          curve = "cubic-bezier(0,1,1,1)";
          duration = 0.5;
          start = 0;
          end = "window-raw-opacity";
        };
        blur-opacity = "opacity";
        shadow-opacity = "opacity";

        scale-x = {
          curve = "cubic-bezier(0,1.3,1,1)";
          duration = 0.5;
          start = 0.6;
          end = 1;
        };
        scale-y = "scale-x";

        offset-x = "(1 - scale-x) / 2 * window-width";
        offset-y = "(1 - scale-y) / 2 * window-height";

        shadow-scale-x = "scale-x";
        shadow-scale-y = "scale-y";
        shadow-offset-x = "offset-x";
        shadow-offset-y = "offset-y";
      },
      {
        triggers = ["geometry"];
        scale-x = {
          curve = "cubic-bezier(0,0,0,1.28)";
          duration = 0.5;
          start = "window-width-before / window-width";
          end = 1;
        };

        scale-x-reverse = {
          curve = "cubic-bezier(0,0,0,1.28)";
          duration = 0.3;
          start = "window-width / window-width-before";
          end = 1;
        };
        scale-y = {
          curve = "cubic-bezier(0,0,0,1.28)";
          duration = 0.5;
          start = "window-height-before / window-height";
          end = 1;
        };
        scale-y-reverse = {
          curve = "cubic-bezier(0,0,0,1.28)";
          duration = 0.5;
          start = "window-height / window-height-before";
          end = 1;
        };
        offset-x = {
          curve = "cubic-bezier(0,0,0,1.28)";
          duration = 0.5;
          start = "window-x-before - window-x";
          end = 0;
        };
        offset-y = {
          curve = "cubic-bezier(0,0,0,1.28)";
          duration = 0.5;
          start = "window-y-before - window-y";
          end = 0;
        };
        shadow-scale-x = "scale-x";
        shadow-scale-y = "scale-y";
        shadow-offset-x = "offset-x";
        shadow-offset-y = "offset-y";
      }
    );
  },

  # ─────────────────────────────────────────────────────────────────────────
  # BSPWM WORKSPACE CHANGES - Mostrar ventanas minimizadas
  # ─────────────────────────────────────────────────────────────────────────
  {
    triggers = ["show"];
    opacity = {
      curve = "cubic-bezier(0,1,1,1)";
      duration = 0.5;
      start = 0;
      end = "window-raw-opacity";
    };
    blur-opacity = "opacity";
    shadow-opacity = "opacity";

    scale-x = {
      curve = "cubic-bezier(0,1.3,1,1)";
      duration = 0.5;
      start = 0.6;
      end = 1;
    };
    scale-y = "scale-x";

    offset-x = "(1 - scale-x) / 2 * window-width";
    offset-y = "(1 - scale-y) / 2 * window-height";

    shadow-scale-x = "scale-x";
    shadow-scale-y = "scale-y";
    shadow-offset-x = "offset-x";
    shadow-offset-y = "offset-y";
  },

  # ─────────────────────────────────────────────────────────────────────────
  # TERMINALES (Kitty, Alacritty) - Slide desde arriba
  # ─────────────────────────────────────────────────────────────────────────
  {
    match = "class_g = 'kitty' || class_g = 'Alacritty'";
    animations = (
      {
        triggers = ["open"];
        opacity = { duration = 0.2; start = 0; end = 1; };
        offset-y = { duration = 0.2; start = -50; end = 0; };
        scale-x = { duration = 0.2; start = 0.95; end = 1; };
        scale-y = { duration = 0.2; start = 0.95; end = 1; };
      },
      {
        triggers = ["close"];
        opacity = { duration = 0.15; start = 1; end = 0; };
        offset-y = { duration = 0.15; start = 0; end = 50; };
      }
    );
  },

  # ─────────────────────────────────────────────────────────────────────────
  # ROFI / LAUNCHERS - Zoom rápido
  # ─────────────────────────────────────────────────────────────────────────
  {
    match = "class_g = 'Rofi'";
    corner-radius = 20;
    shadow = true;
    animations = (
      {
        triggers = ["open"];
        opacity = { duration = 0.12; start = 0; end = 1; };
        scale-x = { duration = 0.12; start = 0.9; end = 1; };
        scale-y = { duration = 0.12; start = 0.9; end = 1; };
      },
      {
        triggers = ["close"];
        opacity = { duration = 0.1; start = 1; end = 0; };
        scale-x = { duration = 0.1; start = 1; end = 0.9; };
        scale-y = { duration = 0.1; start = 1; end = 0.9; };
      }
    );
  },

  # ─────────────────────────────────────────────────────────────────────────
  # DIÁLOGOS - Slide desde arriba
  # ─────────────────────────────────────────────────────────────────────────
  {
    match = "window_type = 'dialog'";
    animations = (
      {
        triggers = ["open"];
        opacity = { duration = 0.18; start = 0; end = 1; };
        offset-y = { duration = 0.18; start = -30; end = 0; };
      },
      {
        triggers = ["close"];
        opacity = { duration = 0.12; start = 1; end = 0; };
        offset-y = { duration = 0.12; start = 0; end = -20; };
      }
    );
  },

  # ─────────────────────────────────────────────────────────────────────────
  # MENÚS POPUP/DROPDOWN Y TOOLTIPS
  # ─────────────────────────────────────────────────────────────────────────
  {
    match = "window_type = 'popup_menu' || window_type = 'dropdown_menu'";
    shadow = true;
    opacity = 0.95;
    animations = (
      {
        triggers = ["open"];
        opacity = { duration = 0.1; start = 0; end = 1; };
        offset-y = { duration = 0.1; start = -10; end = 0; };
      },
      {
        triggers = ["close"];
        opacity = { duration = 0.08; start = 1; end = 0; };
      }
    );
  },
  {
    match = "window_type = 'tooltip'";
    opacity = 0.9;
    shadow = true;
    animations = (
      { triggers = ["open"]; opacity = { duration = 0.1; start = 0; end = 1; }; },
      { triggers = ["close"]; opacity = { duration = 0.08; start = 1; end = 0; }; }
    );
  },

  # ─────────────────────────────────────────────────────────────────────────
  # NOTIFICACIONES (Dunst) - Slide desde la derecha
  # ─────────────────────────────────────────────────────────────────────────
  {
    match = "class_g = 'Dunst' || window_type = 'notification'";
    shadow = true;
    animations = (
      {
        triggers = ["open"];
        opacity = { duration = 0.2; start = 0; end = 1; };
        offset-x = { duration = 0.2; start = 50; end = 0; };
      },
      {
        triggers = ["close"];
        opacity = { duration = 0.15; start = 1; end = 0; };
        offset-x = { duration = 0.15; start = 0; end = 50; };
      }
    );
  },

  # ─────────────────────────────────────────────────────────────────────────
  # FIREFOX / NAVEGADORES - Zoom suave
  # ─────────────────────────────────────────────────────────────────────────
  {
    match = "class_g = 'firefox' || class_g = 'Chromium' || class_g = 'Google-chrome'";
    animations = (
      {
        triggers = ["open"];
        opacity = { duration = 0.25; start = 0; end = 1; };
        scale-x = { duration = 0.25; start = 0.9; end = 1; };
        scale-y = { duration = 0.25; start = 0.9; end = 1; };
      },
      {
        triggers = ["close"];
        opacity = { duration = 0.2; start = 1; end = 0; };
        scale-x = { duration = 0.2; start = 1; end = 0.9; };
        scale-y = { duration = 0.2; start = 1; end = 0.9; };
      }
    );
  },

  # ─────────────────────────────────────────────────────────────────────────
  # EWW WIDGETS - Slide desde la izquierda
  # ─────────────────────────────────────────────────────────────────────────
  {
    match = "class_g = 'eww' || class_g = 'Eww'";
    shadow = false;
    animations = (
      {
        triggers = ["open"];
        opacity = { duration = 0.2; start = 0; end = 1; };
        offset-x = { duration = 0.2; start = -30; end = 0; };
      },
      {
        triggers = ["close"];
        opacity = { duration = 0.15; start = 1; end = 0; };
        offset-x = { duration = 0.15; start = 0; end = -30; };
      }
    );
  },

  # ─────────────────────────────────────────────────────────────────────────
  # FULLSCREEN & POLYBAR - Sin animaciones ni decoraciones extra
  # ─────────────────────────────────────────────────────────────────────────
  {
    match = "fullscreen";
    corner-radius = 0;
    shadow = false;
    animations = ();
  },
  {
    match = "window_type = 'dock' || class_g = 'Polybar'";
    shadow = false;
    blur-background = false;
    corner-radius = 0;
    animations = ();
  },

  # ─────────────────────────────────────────────────────────────────────────
  # CATCH-ALL: Animación por defecto para todo lo demás
  # ─────────────────────────────────────────────────────────────────────────
  {
    animations = (
      {
        triggers = ["open"];
        opacity = { duration = 0.2; start = 0; end = 1; };
        scale-x = { duration = 0.2; start = 0.9; end = 1; };
        scale-y = { duration = 0.2; start = 0.9; end = 1; };
      },
      {
        triggers = ["close"];
        opacity = { duration = 0.15; start = 1; end = 0; };
        scale-x = { duration = 0.15; start = 1; end = 0.9; };
        scale-y = { duration = 0.15; start = 1; end = 0.9; };
      },
      {
        triggers = ["show"];
        opacity = { duration = 0.15; start = 0; end = 1; };
        offset-x = { duration = 0.15; start = -20; end = 0; };
      },
      {
        triggers = ["hide"];
        opacity = { duration = 0.15; start = 1; end = 0; };
        offset-x = { duration = 0.15; start = 0; end = 20; };
      }
    );
  }
);

##############################################################################
#                                   GENERAL                                  #
##############################################################################
backend = "glx";
vsync = true;
dbus = true;
detect-client-opacity = true;
detect-transient = true;
detect-client-leader = true;
use-damage = true;
log-level = "warn";
