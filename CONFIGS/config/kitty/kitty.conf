enable_audio_bell no

include color.ini

font_family HackNerdFont
font_size 13

disable_ligatures never

url_color #61afef

url_style curly

map alt+left neighboring_window left
map alt+right neighboring_window right
map alt+up neighboring_window up
map alt+down neighboring_window down

map f1 copy_to_buffer a
map f2 paste_from_buffer a
map f3 copy_to_buffer b
map f4 paste_from_buffer b

cursor_shape beam
cursor_beam_thickness 1.8

mouse_hide_wait 3.0
detect_urls yes

repaint_delay 10
input_delay 3
sync_to_monitor yes

map ctrl+shift+z toggle_layout stack
tab_bar_style powerline

active_tab_background #98c379
inactive_tab_background #e06c75
inactive_tab_foreground #000000
tab_bar_margin_color black

map ctrl+shift+enter new_window_with_cwd
map ctrl+shift+t new_tab_with_cwd

background_opacity 0.93

shell zsh

##############################################################################
#                              ANIMACIONES                                   #
##############################################################################

# Cursor trail (rastro del cursor)
cursor_trail 3
cursor_trail_decay 0.1 0.4
cursor_trail_start_threshold 2

# Parpadeo del cursor
cursor_blink_interval 0.5
cursor_stop_blinking_after 15.0

# Visual bell (animación en lugar de sonido)
visual_bell_duration 0.2
visual_bell_color #ff6b6b

# Scroll suave
wheel_scroll_multiplier 5.0
wheel_scroll_min_lines 1
touch_scroll_multiplier 1.0

# Animación de redimensionado
resize_debounce_time 0.05
resize_draw_strategy scale
resize_in_steps no

# Animación de ventanas
window_margin_width 2
window_padding_width 8
placement_strategy center

# Tab bar animado
tab_bar_edge bottom
tab_bar_margin_width 5.0
tab_bar_margin_height 5.0 0.0
tab_bar_style powerline
tab_powerline_style slanted
tab_bar_min_tabs 2
tab_activity_symbol "🔔 "
tab_title_max_length 20

# Transiciones de tabs
active_tab_font_style bold-italic
inactive_tab_font_style normal
